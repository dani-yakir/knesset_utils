# Render Blueprint for the MCP server.
#
# Before first deploy, set these to your real values:
#   - service `name`              -> also decides the URL: https://<name>.onrender.com
#   - MCP_PUBLIC_URL              -> that same URL
#   - MIRROR_REPO                 -> owner/repo that holds the mirror releases
# And in the Render dashboard (never commit it), set the secret:
#   - MCP_AUTH_TOKEN             -> `openssl rand -hex 32`; same value goes into n8n
#
# For a PRIVATE mirror repo also add GITHUB_TOKEN (a fine-grained PAT with
# contents:read) as a dashboard secret.
services:
  - type: web
    name: knesset-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter            # always-on; free tier can't attach a disk and cold-starts
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: mirror-data
      mountPath: /data
      sizeGB: 2              # ~800 MB DB + an equally large .part during the atomic swap
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: MCP_HOST
        value: 0.0.0.0
      - key: MCP_DB_PATH
        value: /data/knesset_mirror.sqlite
      - key: MCP_PUBLIC_URL
        value: https://knesset-mcp.onrender.com
      - key: MIRROR_REPO
        value: dani-yakir/knesset-utils
      - key: MIRROR_RELEASE_TAG
        value: latest
      - key: MIRROR_ASSET
        value: knesset_mirror.sqlite.zst
      - key: MIRROR_ZSTD_LONG
        value: "27"           # must equal `zstd --long=NN` in .github/workflows/regenerate.yml
      - key: MIRROR_REFRESH_INTERVAL_SECONDS
        value: "21600"        # re-check the release every 6h
      - key: MCP_AUTH_TOKEN
        sync: false           # set in the dashboard; do not commit
    # PORT is injected by Render automatically -- do not set it.
